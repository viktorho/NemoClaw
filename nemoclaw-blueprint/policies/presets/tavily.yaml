preset:
  name: tavily
  description: "Tavily web search API access"

# Tavily Search API — allows Python and curl to reach the Tavily endpoint.
network_policies:
  tavily:
    name: tavily
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/search" }
          - allow: { method: POST, path: "/extract" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/curl }
